<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}centre de la photographie ordinaire · brouillons</title>
  <meta name="description" content="Brouillons du site du centre de la photographie ordinaire : la collection « le commun des mortels », 3 000 000 de photographies de famille, 400 thèmes." />
  <!-- charte : corps Spectral (fallback serif systeme), titres DIN (fallback sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ "style.css" | relURL }}" />
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
<footer class="site-footer">
  <span>centre de la photographie ordinaire · brouillons</span>
</footer>
<script>
/* hamburger dropdown — droite */
(function () {
  var btn = document.querySelector('.menu-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  function close() {
    nav.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Ouvrir le menu');
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
  });
  nav.addEventListener('click', function (e) {
    if (e.target.closest('a')) close();
  });
  document.addEventListener('click', function (e) {
    if (nav.classList.contains('open') && !nav.contains(e.target) && !btn.contains(e.target)) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();
/* accordéon (.acc-item / .collection-item / .fabrique-item / .expo-item) :
   un seul panneau ouvert à la fois.

   Ouvrir un panneau referme le précédent ; si ce précédent était AU-DESSUS, sa
   fermeture retire de la hauteur et le panneau qu'on vient d'ouvrir remonte
   hors de l'écran (bug constaté sur expositions/ : le titre cliqué disparaissait
   au-dessus de la page). On le ramène donc dans la vue — mais seulement s'il en
   est effectivement sorti, pour ne pas contrarier le défilement normal. */
(function () {
  function makeAccordion(sel) {
    var items = Array.prototype.slice.call(document.querySelectorAll(sel));
    if (!items.length) return;
    items.forEach(function (d) {
      d.addEventListener('toggle', function () {
        if (!d.open) return;
        items.forEach(function (o) { if (o !== d) o.open = false; });
        // Les fermetures ci-dessus ont pu décaler la mise en page : laisser le
        // navigateur la recalculer avant de vérifier la position.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var s = d.querySelector('summary');
            var r = (s || d).getBoundingClientRect();
            var marge = 12;
            if (r.top < marge) {
              window.scrollBy(0, r.top - marge);
            } else if (r.bottom > window.innerHeight - marge) {
              window.scrollBy(0, Math.min(r.bottom - (window.innerHeight - marge),
                                         r.top - marge));
            }
          });
        });
      });
    });
  }
  makeAccordion('.acc-item');
  makeAccordion('.agenda-item');
  makeAccordion('.collection-item');
  makeAccordion('.fabrique-item');
  makeAccordion('.expo-item');
})();
</script>
</body>
</html>
