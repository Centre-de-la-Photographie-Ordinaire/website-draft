{{ define "main" }}
<main class="main main-large">
{{ .Content }}
{{ with .Params.expos }}
<div class="expo-layout">
  <aside class="expo-fixe" aria-label="visuel du centre">
    <img src="/images/expositions/image-fixe-gauche.jpg"
         alt="Femme avec du scotch adhésif sur les yeux"
         width="1600" height="1068" loading="eager">
    <p class="expo-legende">Dommage !<br>Centre d'art et de photographie, Lectoure</p>
  </aside>
  <div class="expo-liste">
    <ol>
      {{ range $i, $e := . }}
      <li>
        <details class="expo-item">
          <summary>
            <span class="expo-nom">{{ $e.nom }}</span>
            <span class="expo-meta">{{ $e.date }} · {{ $e.lieu }}</span>
          </summary>
          <div class="expo-visuel">
            {{ with $e.image }}
            <img src="{{ . }}" alt="{{ $e.nom }}" loading="lazy">
            {{ else }}
            <span class="expo-void">à compléter</span>
            {{ end }}
          </div>
        </details>
      </li>
      {{ end }}
    </ol>
  </div>
</div>
{{ end }}
</main>
{{ end }}
