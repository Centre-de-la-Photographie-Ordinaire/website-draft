{{ define "main" }}
<main class="main main-large">
{{ .Content }}
{{ with .Params.expos }}
<div class="expo-grid-50">
  <div class="expo-col-gauche">
    {{ range $i, $e := . }}
    <figure class="expo-image-large{{ if eq $i 0 }} active{{ end }}" data-expo-image="expo-{{ $i }}">
      {{ with $e.image }}<img src="{{ . }}" alt="{{ $e.nom }}"{{ if eq $i 0 }} loading="eager"{{ else }} loading="lazy"{{ end }} />{{ end }}
      <figcaption>{{ $e.date }} · {{ $e.lieu }}</figcaption>
    </figure>
    {{ end }}
  </div>
  <nav class="expo-col-droite" aria-label="liste des expositions">
    <ol>
      {{ range $i, $e := . }}
      <li>
        <button type="button" class="expo-item{{ if eq $i 0 }} active{{ end }}" data-expo="expo-{{ $i }}">
          <span class="expo-nom">{{ $e.nom }}</span>
          <span class="expo-meta">{{ $e.date }} · {{ $e.lieu }}</span>
        </button>
        <div class="expo-detail" id="expo-{{ $i }}">
          {{ with $e.texte }}<p>{{ . }}</p>{{ end }}
        </div>
      </li>
      {{ end }}
    </ol>
  </nav>
</div>

<script>
/* Expositions — col-6 image/legend + col-6 list with detail under each item (PDF pages 9-10) */
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.expo-item'));
  var images = Array.prototype.slice.call(document.querySelectorAll('.expo-image-large'));
  if (!items.length || !images.length) return;

  items.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var targetId = btn.dataset.expo;

      items.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var detail = document.getElementById(targetId);
      if (detail) {
        var allDetails = Array.prototype.slice.call(document.querySelectorAll('.expo-detail'));
        allDetails.forEach(function (d) { d.classList.remove('active'); });
        detail.classList.toggle('active');
      }

      images.forEach(function (img) { img.classList.remove('active'); });
      var activeImg = document.querySelector('.expo-image-large[data-expo-image="' + targetId + '"]');
      if (activeImg) activeImg.classList.add('active');
    });
  });
})();
</script>
{{ end }}
</main>
{{ end }}
