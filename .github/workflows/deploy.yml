name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# unique ligne differenciante entre les deux repos (website-draft vs .github.io)
env:
  HUGO_BASE_URL: "https://centre-de-la-photographie-ordinaire.github.io/website-draft/"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          set -eux
          HUGO_VERSION=0.159.0
          wget -qO /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf /tmp/hugo.tar.gz -C /tmp hugo
          /tmp/hugo version
      - name: Build
        run: /tmp/hugo build --minify --baseURL "${HUGO_BASE_URL}" --destination public
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -ex
          cd public
          git init -q
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "pages build ${GITHUB_SHA}"
          git remote add origin "https://x-token:${TOKEN}@github.com/${REPO}.git"
          git push -f -q origin HEAD:refs/heads/gh-pages
