# Page projet GitHub Pages : le site est servi sous /website-draft/
# (cf. HUGO_BASE_URL dans .github/workflows/deploy.yml)
baseURL = "https://centre-de-la-photographie-ordinaire.github.io/website-draft/"
languageCode = "fr-fr"
title = "Centre de la photographie ordinaire · brouillons"
timeZone = "Europe/Paris"
enableRobustParser = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# menu principal (hamburger) — les libellés sont les titres des pages,
# sans préfixe « page N · » (retour client 2026-10-19).

[[menu.main]]
  name = "accueil"
  pageRef = "/"
  weight = 1

[[menu.main]]
  name = "objet"
  pageRef = "/objet"
  weight = 2

[[menu.main]]
  name = "missions"
  pageRef = "/missions"
  weight = 3

[[menu.main]]
  name = "agenda"
  pageRef = "/agenda"
  weight = 4

[[menu.main]]
  name = "collection"
  pageRef = "/collection"
  weight = 5

[[menu.main]]
  name = "expositions"
  pageRef = "/expositions"
  weight = 6

[[menu.main]]
  name = "résidences"
  pageRef = "/residences"
  weight = 7

[[menu.main]]
  name = "collecte"
  pageRef = "/collecte"
  weight = 8

[[menu.main]]
  name = "soutien"
  pageRef = "/soutien"
  weight = 9

[[menu.main]]
  name = "fabrique"
  pageRef = "/fabrique"
  weight = 10

[[menu.main]]
  name = "contact"
  pageRef = "/contact"
  weight = 11

# ---------------------------------------------------------------------------
# paramètres du site
# ---------------------------------------------------------------------------
[params]
  # Formulaire « être prévenu des prochaines parutions » (bas de la page
  # collection). Endpoint Formspree fourni par le client ; pour en changer,
  # remplacer seulement l'identifiant après https://formspree.io/f/.
  formspree_collection = "https://formspree.io/f/xrppwypr"
